name: Deploy staging

# Manual on purpose: the owner decides when staging changes (CLAUDE.md, workflow). Run it from
# Actions → "Deploy staging" → Run workflow. Setup: docs/DEPLOYMENT.md.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      USER_NAME: ${{ vars.DEPLOY_USER }}
      DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST(variable)"
          [ -n "$USER_NAME" ] || missing="$missing DEPLOY_USER(variable)"
          [ -n "$SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing. See docs/DEPLOYMENT.md."
            exit 1
          fi
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Pin the server's key when it is given; otherwise trust it on first use.
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 "$HOST" > ~/.ssh/known_hosts
          fi
      - name: Copy deployment files
        run: |
          ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" 'mkdir -p ~/mustamir'
          scp -i ~/.ssh/id_deploy deploy/compose.yml deploy/Caddyfile deploy/up.sh \
            "$USER_NAME@$HOST:mustamir/"
      - name: Start
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" \
            "bash ~/mustamir/up.sh '$IMAGE' '$DOMAIN' '$GITHUB_ACTOR'"
