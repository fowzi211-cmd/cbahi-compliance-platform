name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm i18n:check
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mustamir
          POSTGRES_PASSWORD: mustamir
          POSTGRES_DB: mustamir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mustamir -d mustamir"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The example values match the CI services (dev-only credentials and secret).
      - run: cp .env.example .env
      # Creates the _test database, the app roles and applies migrations before the tests.
      - run: pnpm test:int

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mustamir
          POSTGRES_PASSWORD: mustamir
          POSTGRES_DB: mustamir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mustamir -d mustamir"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Invitation emails are read back from Mailpit's API by the e2e tests.
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: cp .env.example .env
      # Document uploads and signed downloads need the S3-compatible store and its bucket.
      - run: docker compose up -d --wait seaweedfs && docker compose run --rm seaweedfs-init
      - run: pnpm db:setup
      # The library e2e tests browse the fictional DEMO-AMB framework.
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
